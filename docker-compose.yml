# Local Postgres 16 for tests and the migrate gate. One shared project name, so
# every worktree reuses the same container; the gates create throwaway databases.
name: meterwise
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meterwise
      POSTGRES_PASSWORD: meterwise
      POSTGRES_DB: meterwise
    ports:
      - "127.0.0.1:${METERWISE_PG_PORT:-54329}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterwise -d meterwise"]
      interval: 2s
      timeout: 3s
      retries: 20
