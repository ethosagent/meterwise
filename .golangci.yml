# golangci-lint v2 config. Pinned version: tools/go.mod. Run: scripts/check-lint.sh
# This file is a protected path (.agents/risk.yaml): never loosen it to make
# a check pass. Every //nolint must name the linter and give a reason.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose    # unclosed upstream response bodies leak connections
    - contextcheck # context must flow through the call path
    - errorlint    # errors.Is/As, %w wrapping
    - forbidigo    # banned calls, see below
    - funlen       # functions <= 50 lines (docs/conventions.md)
    - gocognit
    - gosec
    - misspell
    - noctx        # every outbound request carries a context
    - nolintlint
    - revive
    - unconvert
  settings:
    funlen:
      lines: 50
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 20
    nolintlint:
      require-explanation: true
      require-specific: true
    misspell: {} # default locale: accepts both UK and US spellings (the plan uses "normalise")
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.(DefaultClient|DefaultTransport|Get|Head|Post|PostForm)$
          msg: "use an explicit http.Client or Transport with timeouts; the default client has none (HOT-1)"
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: "use the injected *slog.Logger (PRIV-1)"
        - pattern: ^(fmt\.Print|fmt\.Printf|fmt\.Println|print|println)$
          msg: "write to an injected io.Writer or log through slog (only cmd/ may use stdout)"
        - pattern: ^os\.(Exit|Getenv|LookupEnv|Environ)$
          msg: "configuration arrives through internal/config with an injected lookup (only cmd/ may read process state)"
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [funlen, gocognit, errcheck, gosec, forbidigo, bodyclose, noctx]
      - path: ^cmd/ # the binary owns process state (env, exit, stdout); the library never does
        linters: [forbidigo]
      - path: ^internal/(nonet|store/pgtest)/ # test-support seams: they install the guard on, and read the CI/DSN env for, tests
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/ethosagent/meterwise]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
