name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # The full gate below needs Postgres (test and migrate gates), exactly as in ci.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_USER: meterwise
          POSTGRES_PASSWORD: meterwise
          POSTGRES_DB: meterwise
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U meterwise -d meterwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migrate gate compares with main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Full gate before release
        run: scripts/run-checks.sh
        env:
          TEST_DATABASE_URL: postgres://meterwise:meterwise@127.0.0.1:54329/meterwise?sslmode=disable
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push meterwised + web/dist (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
